name: Extract project ZIP
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          if [ -f "project-export-final (2).zip" ]; then
            unzip -o "project-export-final (2).zip" -d .
            rm -f "project-export-final (2).zip"
          else
            echo "ZIP file not found - nothing to extract."
            exit 0
          fi

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract project files"
          git push
